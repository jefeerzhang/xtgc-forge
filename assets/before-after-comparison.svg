  <rect width="1200" height="720" fill="#0e1116"/>

  <text x="600" y="48" text-anchor="middle" fill="#f0f6fc" font-size="30" font-weight="700">同一批 12 篇气候金融文献</text>
  <text x="600" y="80" text-anchor="middle" fill="#7d8590" font-size="17">两种不同处理流程，产出形态对比</text>
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#21262d" stroke-width="1"/>

  <!-- BEFORE -->
  <g>
    <rect x="40" y="120" width="555" height="565" rx="14" fill="url(#beforeGrad)" stroke="#5a2a2a" stroke-width="1.5" filter="url(#shadow)"/>
