    <text x="627" y="622" fill="#7d8590" font-size="13">· 闸门脚本 87/87 passed · 6 步全 PASS</text>

    <rect x="627" y="640" width="510" height="32" rx="6" fill="#0a1d28" stroke="#1f6f8b" stroke-width="1"/>
    <text x="883" y="661" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">选题工坊三绝活：反坍缩 · 贡献类型门 · 5 闸硬暂停</text>
