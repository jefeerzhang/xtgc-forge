    <text x="62" y="244" fill="#7d8590" font-size="12">T-Score 0.88 · 套话塌缩 · 概念空泛</text>

    <text x="62" y="278" fill="#f0f6fc" font-size="15" font-weight="600">选题 2</text>
    <text x="62" y="300" fill="#ffa198" font-size="13">《极端气候对商业银行稳定性的影响及传导机制》</text>
    <text x="62" y="322" fill="#7d8590" font-size="12">T-Score 0.82 · 直觉常识 · 缺企业博弈</text>

    <text x="62" y="356" fill="#f0f6fc" font-size="15" font-weight="600">选题 3</text>
    <text x="62" y="378" fill="#ffa198" font-size="13">《企业气候风险信息披露的经济后果研究》</text>
    <text x="62" y="400" fill="#7d8590" font-size="12">T-Score 0.85 · 单向相关 · 忽略漂绿</text>

