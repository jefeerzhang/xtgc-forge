      <stop offset="0%" stop-color="#3a1f1f"/>
      <stop offset="100%" stop-color="#1f0e0e"/>
    </linearGradient>
    <linearGradient id="afterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2a3a"/>
      <stop offset="100%" stop-color="#0a1d28"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
